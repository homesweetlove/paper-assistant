[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-assistant-offline"
version = "0.2.0"
description = "Offline Korean academic-writing review assistant"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["python-docx>=1.1.2,<2.0"]

[tool.setuptools.packages.find]
include = ["paper_assistant*"]
