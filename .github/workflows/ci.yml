name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline analysis and document safety tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile paper_assistant.pyw paper_assistant/analysis.py paper_assistant/documents.py paper_assistant/reports.py paper_assistant/orchestra.py paper_assistant/orchestra_ui.py paper_assistant/orchestra_bootstrap.py
