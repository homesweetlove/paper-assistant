name: Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test before packaging
        run: python -m unittest discover -s tests -v
      - name: Build standalone EXE
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --collect-all docx --name PaperAssistant paper_assistant.pyw
      - name: Compute SHA-256
        shell: pwsh
        run: (Get-FileHash dist/PaperAssistant.exe -Algorithm SHA256).Hash.ToLower() + '  PaperAssistant.exe' | Out-File -Encoding ascii dist/PaperAssistant.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PaperAssistant-Windows
          path: |
            dist/PaperAssistant.exe
            dist/PaperAssistant.exe.sha256
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Paper Assistant ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/PaperAssistant.exe
            dist/PaperAssistant.exe.sha256
